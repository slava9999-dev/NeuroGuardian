name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # Job 1: Lint, Build, Test
  # ============================================
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # ✅ CRITICAL FIX: Actually run Vitest tests
      - name: Run Unit & Integration Tests
        run: npm test

      - name: Check bundle size
        run: |
          if [ -d "dist/assets" ]; then
            BUNDLE_SIZE=$(du -sb dist/assets/*.js 2>/dev/null | awk '{sum+=$1} END {print sum}')
            MAX_SIZE=500000
            if [ ! -z "$BUNDLE_SIZE" ] && [ $BUNDLE_SIZE -gt $MAX_SIZE ]; then
              echo "❌ Bundle size ($BUNDLE_SIZE bytes) exceeds limit ($MAX_SIZE bytes)"
              exit 1
            fi
            echo "✅ Bundle size OK: $BUNDLE_SIZE bytes"
          fi

      - name: Security Audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Production Readiness Check
        run: npm run check:production
        env:
          CI: true

  # ============================================
  # Job 2: Static Policy Checks (Regression Prevention)
  # Uses consolidated script to avoid DRY violations
  # ============================================
  policy-checks:
    runs-on: ubuntu-latest
    needs: lint-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ✅ CRITICAL FIX: Use single consolidated script
      - name: Run Static Policy Checks
        run: npm run check:regression

  # ============================================
  # Job 3: Security Scan (Snyk)
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
