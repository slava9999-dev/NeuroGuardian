name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          if [ -d "dist/assets" ]; then
            BUNDLE_SIZE=$(du -sb dist/assets/*.js 2>/dev/null | awk '{sum+=$1} END {print sum}')
            MAX_SIZE=500000
            if [ ! -z "$BUNDLE_SIZE" ] && [ $BUNDLE_SIZE -gt $MAX_SIZE ]; then
              echo "❌ Bundle size ($BUNDLE_SIZE bytes) exceeds limit ($MAX_SIZE bytes)"
              exit 1
            fi
            echo "✅ Bundle size OK: $BUNDLE_SIZE bytes"
          fi

      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================
  # Regression Tests - Prevent known bugs
  # ============================================
  regression-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check critical files exist
        run: |
          CRITICAL_FILES=(
            "src/api-lib/lib/logger.ts"
            "api/handlers/admin.ts"
            "api/handlers/sentinel.ts"
            ".gitignore"
            "package.json"
          )

          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ REGRESSION: Critical file missing: $file"
              exit 1
            fi
          done
          echo "✅ All critical files present"

      - name: Verify security fixes (Phase 0)
        run: |
          echo "🔍 Checking for regressions in security fixes..."

          # Check 1: API key logging removed
          if grep -n "console\.log.*key.*length" api/handlers/admin.ts; then
            echo "❌ REGRESSION: API key length logging detected in admin.ts!"
            exit 1
          fi

          # Check 2: .env is gitignored
          if ! grep -q "^\.env$" .gitignore; then
            echo "❌ REGRESSION: .env not in .gitignore!"
            exit 1
          fi

          # Check 3: handleResetDb has production guard
          if ! grep -q "isProduction" api/handlers/admin.ts; then
            echo "❌ REGRESSION: Production guard missing in handleResetDb!"
            exit 1
          fi

          # Check 4: Logger exists and exports correctly
          if ! grep -q "export const logger" src/api-lib/lib/logger.ts; then
            echo "❌ REGRESSION: Logger not properly exported!"
            exit 1
          fi

          echo "✅ All Phase 0 security fixes verified - no regressions detected"

      - name: Check for secrets in code
        run: |
          echo "🔍 Scanning for hardcoded secrets..."

          # Check for potential API keys (but allow test fixtures)
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.ts" --include="*.js" api/ src/ --exclude-dir=tests; then
            echo "❌ Potential API keys found in code!"
            exit 1
          fi

          # Check for Bearer tokens
          if grep -r "Bearer [a-zA-Z0-9]\{20,\}" --include="*.ts" --include="*.js" api/ src/ --exclude-dir=tests; then
            echo "❌ Potential Bearer tokens found in code!"
            exit 1
          fi

          # Check for console.log with sensitive data patterns
          if grep -r "console\.log.*\(api.*key\|secret\|password\|token\)" --include="*.ts" api/ src/; then
            echo "❌ Potential sensitive data logging found!"
            exit 1
          fi

          echo "✅ No secrets detected in code"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
