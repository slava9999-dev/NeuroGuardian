# n8n Docker Setup для NeuroGUARDIAN
# Запуск: docker-compose -f docker-compose.n8n.yml --env-file .env.n8n up -d

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: neuroguardian-n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      # N8N Settings
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Europe/Moscow

      # Database (SQLite by default, or use PostgreSQL)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite

      # Security (credentials from .env.n8n)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}

      # Execution settings
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true

      # Allow $env access in workflows
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # Enable Public API (for automation scripts)
      - N8N_PUBLIC_API_DISABLED=false

      # NeuroGUARDIAN API Settings (из .env файла)
      - API_URL=${API_URL:-https://neuro-guardian.vercel.app}
      - CRON_SECRET=${CRON_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID:-7548070478}
      - ADMIN_API_KEY=${ADMIN_API_KEY}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows

    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:5678/healthz' ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
    driver: local
