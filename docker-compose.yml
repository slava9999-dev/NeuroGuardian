version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neuro-postgres
    environment:
      POSTGRES_DB: neuroguardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neuro-network

  api:
    build: .
    container_name: neuro-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LOCAL_DEV: "true"
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/neuroguardian
      CRON_SECRET: ${CRON_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
    depends_on:
      - postgres
    networks:
      - neuro-network

  n8n:
    image: n8nio/n8n:latest
    container_name: neuro-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - CRON_SECRET=${CRON_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - API_URL=http://api:3000
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    networks:
      - neuro-network

volumes:
  postgres_data:
  n8n_data:

networks:
  neuro-network:
    driver: bridge
