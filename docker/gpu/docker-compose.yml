# Docker Compose для GPU-ноды NeuroGUARDIAN (vLLM + Redis + Chroma)
services:
  # LLM Router: Phi-3-mini для классификации интентов
  llm-router:
    image: vllm/vllm-openai:latest
    container_name: neuro-llm-router
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    command:
      - --model
      - mistralai/Mistral-Nemo-Instruct-2407
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.85"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - neuro-gpu-network

  # Redis для Inngest и кэширования контекста (Порт изменен на 6380 для избежания конфликта)
  redis:
    image: redis:7-alpine
    container_name: neuro-gpu-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - neuro-gpu-network
    restart: unless-stopped

  # Vector DB для долгосрочной памяти (RAG/Summarization)
  chroma:
    image: chromadb/chroma:latest
    container_name: neuro-gpu-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - neuro-gpu-network
    restart: unless-stopped

networks:
  neuro-gpu-network:
    driver: bridge

volumes:
  redis_data:
  chroma_data:
