version: '3.8'

services:
  # ==========================================
  # 1. Database (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: neuro-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuroguardian}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neuro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Cache & Queue (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: neuro-prod-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - neuro-net

  # ==========================================
  # 3. Backend API
  # ==========================================
  api:
    build: 
      context: ../..
      dockerfile: Dockerfile
    container_name: neuro-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database connection
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuroguardian}
      # Redis connection
      REDIS_URL: redis://redis:6379
      # Keys (pass these from .env on server)
      CRON_SECRET: ${CRON_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - neuro-net

  # ==========================================
  # 4. Frontend (Nginx)
  # ==========================================
  frontend:
    image: nginx:alpine
    container_name: neuro-prod-frontend
    restart: always
    ports:
      - "80:80"
      #- "443:443" # Uncomment if setting up SSL directly here
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../dist:/usr/share/nginx/html:ro # Mount the local built files
    depends_on:
      - api
    networks:
      - neuro-net

  # ==========================================
  # 5. Browserless (Headless Chrome)
  # ==========================================
  browserless:
    image: browserless/chrome:latest
    container_name: neuro-prod-browser
    restart: always
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
    networks:
      - neuro-net

volumes:
  postgres_data:
  redis_data:

networks:
  neuro-net:
    driver: bridge
